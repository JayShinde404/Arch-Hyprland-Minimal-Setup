####################
##### BINDINGS #####
####################

# Main Key 
$mainMod = SUPER
# Default Programs
$terminal = kitty
$filemanager = thunar
$tuifilemanager = yazi
$menu = rofi -show drun -modes "run,drun,window,recursivebrowser"
$browser1 = zen-browser
$browser2 = w3m

#System
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, T, exec, $terminal
bind = $mainMod, W, killactive,
#bindo = $mainMod, ESCAPE, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod SHIFT, F, exec, $filemanager
bind = $mainMod, Y, togglefloating,
bind = $mainMod, SPACE, exec, $menu 
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, U, togglesplit, # dwindle
bind = $mainMod SHIFT, E, exec, $terminal -e $tuifilemanager 
bind = $mainMod, F, fullscreen
#bind = $mainMod CTRL, L, exec, hyprlock
bind = $mainMod, ESCAPE, exec, ~/.local/bin/powermenu.sh

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, L, movefocus, r
bind = $mainMod, H, movefocus, l  
bind = $mainMod, J, movefocus, d  
bind = $mainMod, K, movefocus, u

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
#bind = $mainMod, S, togglespecialworkspace, magic
#bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Swap Window with other window
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, left, swapwindow, l
bind = $mainMod SHIFT, up, swapwindow, u
bind = $mainMod SHIFT, down, swapwindow, d
bind = $mainMod SHIFT, L, swapwindow, r 
bind = $mainMod SHIFT, H, swapwindow, l 
bind = $mainMod SHIFT, J, swapwindow, d
bind = $mainMod SHIFT, K, swapwindow, u 

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, TAB, workspace, e+1
bind = $mainMod SHIFT, TAB, workspace, e-1

# Resize Window with Keyboard
binde = $mainMod CTRL, left, resizeactive, -15 0
binde = $mainMod CTRL, right, resizeactive, 15 0
binde = $mainMod CTRL, up, resizeactive, 0 -15
binde = $mainMod CTRL, down, resizeactive, 0 15
binde = $mainMod CTRL, H, resizeactive, -15 0
binde = $mainMod CTRL, L, resizeactive, 15 0
binde = $mainMod CTRL, K, resizeactive, 0 -15
binde = $mainMod CTRL, J, resizeactive, 0 15

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

#User-defined
bind = $mainMod SHIFT, V, exec, code
bind = $mainMod SHIFT, B, exec, $terminal -e $browser2 duckduckgo.com
bind = $mainMod SHIFT ALT, B, exec, $browser1
bind = $mainMod CTRL, M, exec, missioncenter
bind = $mainMod CTRL, C, exec, gnome-calculator
bind = $mainMod CTRL, O, exec, desktopeditors
bind = $mainMod SHIFT, P, exec, hyprpicker
bind = $mainMod SHIFT, S, exec, ~/.local/bin/show_status.sh
bind = $mainMod CTRL, P, exec, slurp | grim -g - - | tee ~/Pictures/Screenshots/$(date +%s) | wl-copy
bind = $mainMod SHIFT, O, exec, obsidian
bind = $mainMod, V, exec, cliphist list | rofi -dmenu -display-columns 2 | cliphist decode | wl-copy
bind = $mainMod, R, exec, hyprctl reload
bind = $mainMod SHIFT CTRL, SPACE, exec, ~/.local/bin/wallpaper_switcher.sh

#XDG-Apps
bind = $mainMod SHIFT, D, exec, gtk-launch Discord-web
bind = $mainMod SHIFT, Y, exec, gtk-launch Youtube-web
bind = $mainMod SHIFT, Z, exec, gtk-launch Whatsapp
bind = $mainMod SHIFT, A, exec, gtk-launch ChatGPT
bind = $mainMod SHIFT, C, exec, gtk-launch Calendar
bind = $mainMod SHIFT, W, exec, gtk-launch impala
bind = $mainMod SHIFT, T, exec, gtk-launch btop
bind = $mainMod CTRL, B, exec, gtk-launch bluetui
bind = $mainMod SHIFT, M, exec, gtk-launch wiremix
bind = $mainMod SHIFT, U, exec, gtk-launch package-manager



